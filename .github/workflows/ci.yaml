name: ci

on:
  pull_request:
  push:
    branches: [ develop, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  NEXT_TELEMETRY_DISABLED: "1"
  ECR_REPO: 329551316753.dkr.ecr.us-east-1.amazonaws.com/jimag-dev-car-website-frontend
  IMAGE_TAG: dev-${{ github.sha }}

jobs:
  checks:
    name: Lint / Typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmd: [ lint, typecheck ]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Run checks
        run: |
          case "${{ matrix.cmd }}" in
            lint) npm run lint --if-present ;;
            typecheck) npm run typecheck --if-present ;;
          esac

  build_and_scan:
    name: Build + Trivy scan (report only)
    runs-on: ubuntu-latest
    needs: [checks]   #needs checking

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Next.js cache (keeps builds fast)
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s','**/*.[jt]sx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm ci
      - run: npm run build

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (report only, Docker)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.1 \
            image --exit-code 0 --no-progress --ignore-unfixed \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            "${ECR_REPO}:${IMAGE_TAG}"

          